name: Publish free browser app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: pip install -r requirements.txt
      - name: Restore original real CSV data
        run: python scripts/dataset_package.py restore
      - name: Build browser application and bounded history chunks
        run: python scripts/build_static_pages.py
      - name: Test browser history against the original CSV provider
        run: |
          node tests/pages_history.test.js
          node tests/pages_startup.test.js
          node tests/supabase_auth.test.js
          node tests/billing_navigation.test.js
          node tests/subscription_page.test.js
          node tests/billing_core.test.js
          node tests/checkout_accounts.test.js
          node tests/billing_checkout.test.js
          node tests/trades_sync.test.js
          node tests/fxn_asian_session_range.test.js
          node tests/prop_firm_session.test.js
          node tests/prop_account_management.test.js
          node tests/prop_workspace_lifecycle.test.js
          node tests/prop_practice_chart.test.js
          node tests/prop_order_flow.test.js
          node tests/account_chart_isolation.test.js
          node tests/prop_navigation.test.js
          node tests/chart_navigation_lifecycle.test.js
          node tests/replay_mouse_selection.test.js
          node tests/tool_timeframe_matrix.test.js
          node tests/chart_replay_integration.test.js
          node tests/chart_pointer_integration.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy full app to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
