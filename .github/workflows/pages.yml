name: Publish free browser app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: pip install -r requirements.txt
      - name: Restore original real CSV data
        run: python scripts/dataset_package.py restore
      - name: Build browser application and bounded history chunks
        run: python scripts/build_static_pages.py
      - name: Test browser history against the original CSV provider
        run: node tests/pages_history.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy full app to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
