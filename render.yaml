services:
  - type: web
    name: tradefxbook
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: tradefxbook-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: TRADEFXBOOK_SECRET
        generateValue: true
      - key: TRADEFXBOOK_OWNER_USER
        value: trader
      - key: TRADEFXBOOK_OWNER_PASSWORD
        sync: false
      - key: TRADEFXBOOK_STATE_FILE
        value: /var/data/store.json
      - key: TRADEFXBOOK_CACHE_DIR
        value: /var/data/market_cache
